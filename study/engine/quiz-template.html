<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사전 시험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e3e0d8;
  --accent:#2f5bea; --accent-soft:#e7edff; --ok:#16864a; --ok-soft:#e3f5ea;
  --bad:#c8352b; --bad-soft:#fbe7e5; --warn:#b26a00; --warn-soft:#fff2dc;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --card:#1f2228; --ink:#ecedf0; --muted:#9aa0aa; --line:#30343c;
  --accent:#7d9bff; --accent-soft:#232c48; --ok:#4cc17e; --ok-soft:#18301f;
  --bad:#ff7a6e; --bad-soft:#3a1f1d; --warn:#ffb547; --warn-soft:#3a2c14;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1f2228; --ink:#ecedf0; --muted:#9aa0aa; --line:#30343c;
  --accent:#7d9bff; --accent-soft:#232c48; --ok:#4cc17e; --ok-soft:#18301f;
  --bad:#ff7a6e; --bad-soft:#3a1f1d; --warn:#ffb547; --warn-soft:#3a2c14; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
h1{font-size:1.5rem;margin:0 0 4px;line-height:1.35}
h2{font-size:1.15rem;margin:0 0 12px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chip{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.d-상{background:var(--bad-soft);color:var(--bad)}
.chip.d-중{background:var(--warn-soft);color:var(--warn)}
.chip.d-하{background:var(--ok-soft);color:var(--ok)}
/* 시작 화면 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.mode{text-align:left;padding:16px;border-radius:12px}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode.sel{border-color:var(--accent);background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.25rem}
/* 상단 바 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
/* 문제 */
.qhead{display:flex;gap:10px;align-items:baseline}
.qnum{font-weight:800;font-size:1.2rem;color:var(--accent)}
.pts{margin-left:auto;font-size:.85rem;color:var(--muted);white-space:nowrap}
.passage{background:var(--bg);border-left:4px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;white-space:pre-wrap}
.qtext{font-size:1.08rem;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px}
.choice .no{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.9rem;font-weight:700}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .no{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .no{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .no{background:var(--bad);border-color:var(--bad);color:#fff}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-size:2rem;font-weight:800;padding:18px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:140px;resize:vertical}
.hint{font-size:.88rem;color:var(--muted);margin-top:6px}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.self{background:var(--warn-soft)}
.fb b.t{display:block;margin-bottom:4px}
.src{font-size:.82rem;color:var(--muted);margin-top:6px}
.rubric label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.model{white-space:pre-wrap;background:var(--card);border-radius:8px;padding:10px 12px;margin:8px 0}
/* 하단 내비 */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px}
.palette button{padding:8px 0;font-weight:700;font-size:.9rem}
.palette .done{background:var(--accent-soft);border-color:var(--accent)}
.palette .cur{outline:2px solid var(--accent)}
.palette .r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette .w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* 결과 */
.big{font-size:3rem;font-weight:800;line-height:1.1}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.review{margin-top:14px}
.review details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;background:var(--card)}
.review summary{cursor:pointer;font-weight:600}
.mark{font-weight:800;margin-right:6px}
.mark.r{color:var(--ok)} .mark.w{color:var(--bad)} .mark.p{color:var(--warn)}
/* 오답풀이 */
.rv-box{border-radius:10px;padding:10px 14px;margin-top:10px;border:1px solid var(--line)}
.rv-box .rv-t{display:block;margin-bottom:4px;font-size:.92rem}
.rv-my{background:var(--bad-soft);border-color:transparent}
.rv-ans{background:var(--ok-soft);border-color:transparent}
.rv-why{background:var(--warn-soft);border-color:transparent}
.rv-detail{background:var(--accent-soft);border-color:transparent}
.rv-tip{background:var(--bg)}
.rv-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv-pair .rv-box{margin-top:0}
.pre{white-space:pre-wrap}
.it{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.it.right{border-color:var(--ok)} .it.wrong{border-color:var(--bad)}
.it small{display:block;color:var(--muted);margin-top:2px;font-size:.88rem}
.tag{font-size:.75rem;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.rv-choices{margin-top:10px} .rv-choices summary{cursor:pointer;color:var(--accent);font-weight:600}
.btnlink{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
@media (max-width:520px){ .rv-pair{grid-template-columns:1fr} }
.hidden{display:none!important}
@media (max-width:520px){ .modes{grid-template-columns:1fr} .stats{grid-template-columns:repeat(3,1fr)} body{font-size:16px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- 문제 데이터: build_quiz.py가 이 자리에 JSON을 넣는다 -->
<script id="quiz-data" type="application/json">/*__QUIZ_DATA__*/</script>

<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
var META = DATA.meta || {};
var ALL = DATA.questions || [];
var CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧'];
var STORE_KEY = 'study-kit:' + (META.id || META.title || 'quiz');

/* ---------- 저장소 (실패해도 동작) ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function save(v){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(v)); }catch(e){} }

/* ---------- 상태 ---------- */
var S = { mode:'practice', list:[], idx:0, ans:{}, checked:{}, self:{}, startAt:0, timerId:null, submitted:false };

/* ---------- 유틸 ---------- */
function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') el.className = attrs[k];
    else if(k==='text') el.textContent = attrs[k];
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!==false && attrs[k]!=null) el.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c==null) return; el.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return el;
}
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/[\s.,·・'"‘’“”()\[\]{}~\-_/!?]/g,''); }
function sameSet(a,b){ if(a.length!==b.length) return false; var x=a.slice().sort(), y=b.slice().sort(); for(var i=0;i<x.length;i++) if(x[i]!==y[i]) return false; return true; }
function isMulti(q){ return q.type==='mc' && Array.isArray(q.answer); }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function totalPts(list){ return list.reduce(function(a,q){ return a+(q.points||0); },0); }

/* ---------- 채점: true / false / null(자기채점 필요·미응답) ---------- */
function grade(q, a){
  if(a==null || a==='' || (Array.isArray(a)&&!a.length)) return false;
  if(q.type==='mc') return isMulti(q) ? sameSet(a, q.answer) : a===q.answer;
  if(q.type==='ox') return a===q.answer;
  if(q.type==='short'){
    var acc = Array.isArray(q.answer)?q.answer:[q.answer];
    var n = norm(a); return acc.some(function(x){ return norm(x)===n; });
  }
  if(q.type==='essay') return null;
  return false;
}
function earned(q){
  var a = S.ans[q.id];
  if(q.type==='essay'){ return S.self[q.id]!=null ? S.self[q.id] : 0; }
  return grade(q,a)===true ? (q.points||0) : 0;
}

/* ---------- 시작 화면 ---------- */
function renderStart(){
  stopTimer(); clearHash(); S.view='start'; S.submitted=false;
  if(navEl){ navEl.remove(); navEl=null; }
  var app = document.getElementById('app'); app.innerHTML='';
  var store = load();
  var wrongIds = (store.wrong||[]).filter(function(id){ return ALL.some(function(q){return q.id===id;}); });
  var types = {mc:0,ox:0,short:0,essay:0};
  ALL.forEach(function(q){ types[q.type]=(types[q.type]||0)+1; });
  var mode = S.mode;

  var practiceBtn = h('button',{class:'mode'+(mode==='practice'?' sel':''),onclick:function(){S.mode='practice';renderStart();}},
    [h('b',{text:'연습 모드'}),h('span',{class:'muted',text:'한 문제씩 풀고 바로 정답과 해설을 확인해요.'})]);
  var examBtn = h('button',{class:'mode'+(mode==='exam'?' sel':''),onclick:function(){S.mode='exam';renderStart();}},
    [h('b',{text:'실전 모드'}),h('span',{class:'muted',text:'시험처럼 끝까지 다 풀고 제출한 뒤 한 번에 채점해요.'+(META.timeLimitMin?' (제한 '+META.timeLimitMin+'분)':'')})]);

  var kinds = [];
  if(types.mc) kinds.push('선택형 '+types.mc);
  if(types.ox) kinds.push('OX '+types.ox);
  if(types.short) kinds.push('단답형 '+types.short);
  if(types.essay) kinds.push('서술형 '+types.essay);

  app.appendChild(h('div',{class:'card'},[
    h('div',{class:'muted',text:[META.subject,META.grade,META.unit].filter(Boolean).join(' · ')}),
    h('h1',{text:META.title||'사전 시험'}),
    META.description?h('p',{class:'muted',text:META.description}):null,
    h('div',{class:'stats'},[
      h('div',{class:'stat'},[h('b',{text:String(ALL.length)}),h('span',{class:'muted',text:'문항'})]),
      h('div',{class:'stat'},[h('b',{text:String(totalPts(ALL))}),h('span',{class:'muted',text:'점 만점'})]),
      h('div',{class:'stat'},[h('b',{text:store.best!=null?String(store.best):'–'}),h('span',{class:'muted',text:'최고 점수'})])
    ]),
    h('p',{class:'muted',style:'margin:12px 0 0',text:kinds.join(' · ')}),
    h('div',{class:'modes'},[practiceBtn,examBtn]),
    h('div',{class:'row'},[
      h('button',{class:'primary',onclick:function(){start(ALL);}},['처음부터 풀기']),
      wrongIds.length?h('button',{onclick:function(){ start(ALL.filter(function(q){return wrongIds.indexOf(q.id)>=0;})); }},['틀린 문제만 ('+wrongIds.length+')']):null,
      store.last?h('button',{onclick:function(){ if(restoreLast()) openReview(); }},['📝 지난 오답풀이']):null,
      h('span',{class:'spacer'}),
      h('button',{onclick:toggleTheme,title:'화면 밝기 전환'},['🌓'])
    ])
  ]));
}

function toggleTheme(){
  var r=document.documentElement, cur=r.getAttribute('data-theme');
  var dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme', dark?'light':'dark');
  try{ localStorage.setItem('study-kit:theme', r.getAttribute('data-theme')); }catch(e){}
}
try{ var t=localStorage.getItem('study-kit:theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

/* ---------- 진행 ---------- */
function start(list){
  clearHash(); S.view='quiz';
  S.list = list.slice(); S.idx=0; S.ans={}; S.checked={}; S.self={}; S.submitted=false;
  S.startAt = Date.now();
  if(S.mode==='exam' && META.timeLimitMin){ startTimer(); }
  renderQ();
}
function startTimer(){
  stopTimer();
  S.timerId = setInterval(function(){
    var left = META.timeLimitMin*60 - (Date.now()-S.startAt)/1000;
    var el = document.getElementById('timer');
    if(el){ el.textContent='⏱ '+fmtTime(left); el.classList.toggle('low', left<120); }
    if(left<=0){ stopTimer(); alert('시험 시간이 끝났어요. 자동으로 제출합니다.'); submit(); }
  },1000);
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } }

function answeredCount(){ return S.list.filter(function(q){ var a=S.ans[q.id]; return a!=null && a!=='' && !(Array.isArray(a)&&!a.length); }).length; }

function renderQ(){
  var app=document.getElementById('app'); app.innerHTML='';
  var q=S.list[S.idx], n=S.list.length;
  var practice = S.mode==='practice', checked = !!S.checked[q.id];
  var locked = practice && checked;

  // 상단
  var left = S.mode==='exam' && META.timeLimitMin ? META.timeLimitMin*60-(Date.now()-S.startAt)/1000 : null;
  app.appendChild(h('div',{class:'top'},[
    h('div',{class:'row'},[
      h('span',{class:'muted',text:(practice?'연습':'실전')+' · '+(S.idx+1)+' / '+n}),
      h('span',{class:'spacer'}),
      left!=null?h('span',{id:'timer',class:'timer'+(left<120?' low':''),text:'⏱ '+fmtTime(left)}):null,
      h('button',{onclick:function(){ if(confirm('처음 화면으로 돌아갈까요? 푼 내용은 사라져요.')) renderStart(); },style:'padding:6px 12px'},['나가기'])
    ]),
    h('div',{class:'bar'},[h('i',{style:'width:'+(answeredCount()/n*100)+'%'})])
  ]));

  // 문제 카드
  var card = h('div',{class:'card'});
  card.appendChild(h('div',{class:'qhead'},[
    h('span',{class:'qnum',text:(S.idx+1)+'.'}),
    h('span',{class:'pts',text:(q.points||0)+'점'})
  ]));
  if(q.passage) card.appendChild(h('div',{class:'passage',text:q.passage}));
  card.appendChild(h('div',{class:'qtext',text:q.question}));
  if(isMulti(q)) card.appendChild(h('div',{class:'hint',style:'margin:-8px 0 12px',text:'정답 '+q.answer.length+'개를 모두 고르세요.'}));

  var a = S.ans[q.id];
  function setAns(v){ S.ans[q.id]=v; if(!locked) renderQ(); }

  if(q.type==='mc'){
    var box=h('div',{class:'choices'});
    q.choices.forEach(function(c,i){
      var no=i+1, sel = isMulti(q) ? (a||[]).indexOf(no)>=0 : a===no;
      var cls='choice'+(sel?' sel':'');
      if(locked){
        var right = isMulti(q)? q.answer.indexOf(no)>=0 : q.answer===no;
        if(right) cls='choice right'; else if(sel) cls='choice wrong';
      }
      box.appendChild(h('button',{class:cls,disabled:locked?'disabled':false,onclick:function(){
        if(isMulti(q)){ var arr=(a||[]).slice(), p=arr.indexOf(no); if(p>=0) arr.splice(p,1); else arr.push(no); setAns(arr); }
        else setAns(no);
      }},[h('span',{class:'no',text:CIRCLED[i]||String(no)}),h('span',{text:c})]));
    });
    card.appendChild(box);
  } else if(q.type==='ox'){
    var ox=h('div',{class:'ox'});
    [[true,'O'],[false,'X']].forEach(function(p){
      var cls = a===p[0]?'sel':'';
      if(locked){ if(q.answer===p[0]) cls='right'; else if(a===p[0]) cls='wrong'; }
      ox.appendChild(h('button',{class:'choice '+cls,style:'justify-content:center',disabled:locked?'disabled':false,onclick:function(){setAns(p[0]);}},[p[1]]));
    });
    card.appendChild(ox);
  } else if(q.type==='short'){
    var inp=h('input',{type:'text',value:a||'',placeholder:'답을 입력하세요',disabled:locked?'disabled':false,
      oninput:function(e){ S.ans[q.id]=e.target.value; updateNav(); },
      onkeydown:function(e){ if(e.key==='Enter'){ e.preventDefault(); primaryAction(); } }});
    card.appendChild(inp);
    if(q.answerHint) card.appendChild(h('div',{class:'hint',text:q.answerHint}));
    setTimeout(function(){ if(!locked) inp.focus(); },0);
  } else if(q.type==='essay'){
    var ta=h('textarea',{placeholder:'답안을 작성하세요',disabled:locked?'disabled':false,
      oninput:function(e){ S.ans[q.id]=e.target.value; updateNav(); }});
    ta.value=a||'';
    card.appendChild(ta);
    if(q.answerHint) card.appendChild(h('div',{class:'hint',text:q.answerHint}));
  }

  if(locked) card.appendChild(feedback(q,true));
  app.appendChild(card);

  // 실전 모드: 문항 이동판
  if(!practice){
    var pal=h('div',{class:'palette'});
    S.list.forEach(function(qq,i){
      var aa=S.ans[qq.id], done=aa!=null&&aa!==''&&!(Array.isArray(aa)&&!aa.length);
      pal.appendChild(h('button',{class:(done?'done':'')+(i===S.idx?' cur':''),onclick:function(){S.idx=i;renderQ();}},[String(i+1)]));
    });
    app.appendChild(h('div',{class:'card',style:'margin-top:12px'},[h('div',{class:'muted',text:'문항 이동 (푼 문제는 파란색)'}),pal]));
  }

  renderNav();
}

/* 피드백 블록 (연습 모드 확인 후 / 결과 복습) */
function feedback(q, interactive){
  var a=S.ans[q.id], g=grade(q,a);
  var kids=[];
  if(q.type==='essay'){
    kids.push(h('b',{class:'t',text:'모범 답안과 비교해 스스로 채점해 보세요'}));
    kids.push(h('div',{class:'model',text:q.modelAnswer||''}));
    if(q.rubric && q.rubric.length){
      var rb=h('div',{class:'rubric'});
      q.rubric.forEach(function(r,i){
        var key=q.id+':'+i;
        var cb=h('input',{type:'checkbox',disabled:interactive?false:'disabled'});
        cb.checked=!!(S.self[key]);
        cb.addEventListener('change',function(){
          S.self[key]=cb.checked;
          S.self[q.id]=q.rubric.reduce(function(s,rr,j){ return s+(S.self[q.id+':'+j]?(rr.points||0):0); },0);
          var tot=document.getElementById('self-'+q.id); if(tot) tot.textContent=S.self[q.id]+' / '+(q.points||0)+'점';
        });
        rb.appendChild(h('label',{},[cb,h('span',{text:r.criterion+' ('+(r.points||0)+'점)'})]));
      });
      kids.push(h('div',{class:'muted',text:'채점 기준 — 내 답안에 들어 있는 항목을 체크하세요'}));
      kids.push(rb);
      kids.push(h('div',{},[h('b',{text:'내 점수: '}),h('span',{id:'self-'+q.id,text:(S.self[q.id]||0)+' / '+(q.points||0)+'점'})]));
    }
    if(q.explanation) kids.push(h('div',{style:'margin-top:8px',text:q.explanation}));
    if(q.source) kids.push(h('div',{class:'src',text:'📖 '+q.source}));
    return h('div',{class:'fb self'},kids);
  }
  var ansText;
  if(q.type==='mc') ansText = (isMulti(q)?q.answer:[q.answer]).map(function(n){return CIRCLED[n-1]+' '+q.choices[n-1];}).join(', ');
  else if(q.type==='ox') ansText = q.answer?'O':'X';
  else ansText = (Array.isArray(q.answer)?q.answer:[q.answer]).join(' / ');
  kids.push(h('b',{class:'t',text:g?'⭕ 정답이에요!':'❌ 틀렸어요'}));
  if(!g) kids.push(h('div',{},[h('b',{text:'정답: '}),h('span',{text:ansText})]));
  if(!g && (q.choiceExplanations||q.commonMistakes||q.wrongExplanation)) kids.push(h('div',{class:'pre',style:'margin-top:4px',text:'💬 '+whyWrong(q,a)}));
  if(q.explanation) kids.push(h('div',{style:'margin-top:4px',text:q.explanation}));
  if(q.source) kids.push(h('div',{class:'src',text:'📖 '+q.source}));
  return h('div',{class:'fb '+(g?'ok':'bad')},kids);
}

/* ---------- 하단 버튼 ---------- */
var navEl=null;
function renderNav(){
  if(navEl) navEl.remove();
  navEl=h('div',{class:'nav'},[h('div',{class:'in',id:'navin'})]);
  document.body.appendChild(navEl);
  updateNav();
}
function updateNav(){
  var box=document.getElementById('navin'); if(!box) return;
  box.innerHTML='';
  var q=S.list[S.idx], last=S.idx===S.list.length-1, practice=S.mode==='practice';
  var a=S.ans[q.id], has=a!=null&&a!==''&&!(Array.isArray(a)&&!a.length);
  box.appendChild(h('button',{disabled:S.idx===0?'disabled':false,onclick:function(){S.idx--;renderQ();}},['← 이전']));
  box.appendChild(h('span',{class:'spacer'}));
  if(practice){
    if(!S.checked[q.id]) box.appendChild(h('button',{class:'primary',disabled:has?false:'disabled',onclick:primaryAction},['정답 확인']));
    else box.appendChild(h('button',{class:'primary',onclick:primaryAction},[last?'결과 보기':'다음 →']));
  } else {
    if(!last) box.appendChild(h('button',{class:'primary',onclick:primaryAction},['다음 →']));
    else box.appendChild(h('button',{class:'primary',onclick:primaryAction},['제출하기']));
  }
}
function primaryAction(){
  var q=S.list[S.idx], last=S.idx===S.list.length-1;
  if(S.mode==='practice'){
    if(!S.checked[q.id]){
      var a=S.ans[q.id]; if(a==null||a===''||(Array.isArray(a)&&!a.length)) return;
      S.checked[q.id]=true; renderQ(); return;
    }
    if(last){ submit(); return; }
    S.idx++; renderQ(); return;
  }
  if(!last){ S.idx++; renderQ(); return; }
  var left=S.list.length-answeredCount();
  if(left>0 && !confirm('아직 안 푼 문제가 '+left+'개 있어요. 그래도 제출할까요?')) return;
  submit();
}

/* ---------- 제출 · 결과 ---------- */
function submit(){
  stopTimer(); S.submitted=true;
  if(navEl){ navEl.remove(); navEl=null; }
  var hasEssay = S.list.some(function(q){return q.type==='essay';});
  if(hasEssay && S.mode==='exam'){ renderSelfGrade(); return; }
  finalize(); renderResult();
}

/* 채점 집계 (화면과 저장에서 같이 씀) */
function summarize(){
  var list=S.list, got=0, max=totalPts(list), byDiff={}, byConcept={}, wrong=[];
  list.forEach(function(q){
    var e=earned(q), p=q.points||0; got+=e;
    var full = e>=p && p>0;
    if(!full) wrong.push(q.id);
    var d=q.difficulty||'-'; byDiff[d]=byDiff[d]||{g:0,m:0,n:0,r:0}; byDiff[d].g+=e; byDiff[d].m+=p; byDiff[d].n++; if(full) byDiff[d].r++;
    var c=q.concept||'기타'; byConcept[c]=byConcept[c]||{g:0,m:0,n:0,r:0}; byConcept[c].g+=e; byConcept[c].m+=p; byConcept[c].n++; if(full) byConcept[c].r++;
  });
  return {got:got,max:max,byDiff:byDiff,byConcept:byConcept,wrong:wrong,score100:max?Math.round(got/max*100):0};
}

/* 제출 확정: 오답 목록·최고 점수·기록·마지막 풀이(오답풀이용) 저장 — 한 번만 호출 */
function finalize(){
  S.endAt=Date.now();
  var r=summarize(), list=S.list, st=load();
  var solvedIds=list.map(function(q){return q.id;});
  st.wrong=(st.wrong||[]).filter(function(id){ return solvedIds.indexOf(id)<0; }).concat(r.wrong);
  if(list.length===ALL.length){ st.best=Math.max(st.best||0, r.score100); }
  st.history=(st.history||[]).concat([{at:new Date().toISOString(),mode:S.mode,score:r.got,max:r.max,n:list.length}]).slice(-30);
  st.last={at:new Date().toISOString(),mode:S.mode,ids:solvedIds,ans:S.ans,self:S.self,startAt:S.startAt,endAt:S.endAt};
  save(st);
}

/* 저장된 마지막 풀이 복원 (새로고침·나중에 오답풀이 다시 보기) */
function restoreLast(){
  var L=load().last; if(!L) return false;
  var map={}; ALL.forEach(function(q){map[q.id]=q;});
  S.list=L.ids.map(function(id){return map[id];}).filter(Boolean);
  if(!S.list.length) return false;
  S.mode=L.mode; S.ans=L.ans||{}; S.self=L.self||{}; S.startAt=L.startAt; S.endAt=L.endAt; S.submitted=true;
  return true;
}

/* 실전 모드 서술형: 제출 후 자기채점 단계 */
function renderSelfGrade(){
  var app=document.getElementById('app'); app.innerHTML='';
  app.appendChild(h('div',{class:'card'},[
    h('h2',{text:'서술형 자기 채점'}),
    h('p',{class:'muted',text:'모범 답안과 채점 기준을 보고, 내 답안에 들어 있는 항목을 체크하세요.'})
  ]));
  S.list.forEach(function(q,i){
    if(q.type!=='essay') return;
    app.appendChild(h('div',{class:'card',style:'margin-top:12px'},[
      h('div',{class:'qhead'},[h('span',{class:'qnum',text:(i+1)+'.'}),h('span',{class:'pts',text:(q.points||0)+'점'})]),
      h('div',{class:'qtext',text:q.question}),
      h('div',{class:'muted',text:'내 답안'}),
      h('div',{class:'passage',text:S.ans[q.id]||'(작성하지 않음)'}),
      feedback(q,true)
    ]));
  });
  app.appendChild(h('div',{class:'row',style:'margin-top:14px'},[h('span',{class:'spacer'}),h('button',{class:'primary',onclick:function(){ finalize(); renderResult(); }},['채점 완료 → 결과 보기'])]));
}

function renderResult(){
  S.view='result';
  var app=document.getElementById('app'); app.innerHTML='';
  var list=S.list, R=summarize(), got=R.got, max=R.max, byDiff=R.byDiff, byConcept=R.byConcept, wrong=R.wrong, score100=R.score100;
  var mins=Math.round(((S.endAt||Date.now())-S.startAt)/60000);
  var st=load();

  function table(title,obj,order){
    var keys=Object.keys(obj); if(order) keys.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
    return h('div',{style:'margin-top:16px'},[h('h2',{text:title}),h('table',{},[
      h('thead',{},[h('tr',{},[h('th',{text:'구분'}),h('th',{class:'n',text:'맞힘'}),h('th',{class:'n',text:'점수'})])]),
      h('tbody',{},keys.map(function(k){ var v=obj[k]; return h('tr',{},[h('td',{text:k}),h('td',{class:'n',text:v.r+'/'+v.n}),h('td',{class:'n',text:v.g+'/'+v.m})]); }))
    ])]);
  }

  app.appendChild(h('div',{class:'card'},[
    h('div',{class:'muted',text:(S.mode==='exam'?'실전':'연습')+' 결과 · '+list.length+'문항 · '+mins+'분'}),
    h('div',{class:'big',text:got+' / '+max+'점'}),
    h('div',{class:'muted',text:'100점 환산 '+score100+'점'+(list.length===ALL.length&&st.best!=null?' · 최고 '+st.best+'점':'')}),
    h('div',{class:'row',style:'margin-top:14px'},[
      wrong.length?h('button',{class:'primary',onclick:openReview},['📝 상세 오답풀이 ('+wrong.length+')']):h('span',{text:'🎉 모두 맞혔어요!'}),
      wrong.length?h('button',{onclick:function(){ start(list.filter(function(q){return wrong.indexOf(q.id)>=0;})); }},['틀린 문제 다시 풀기']):null,
      h('button',{onclick:renderStart},['처음 화면'])
    ]),
    table('난이도별',byDiff,['하','중','상','-']),
    table('개념별',byConcept)
  ]));

  // 문항별 복습
  var rv=h('div',{class:'review'},[h('h2',{style:'margin-top:20px',text:'문항별 복습'})]);
  list.forEach(function(q,i){
    var e=earned(q), p=q.points||0;
    var mk = q.type==='essay' ? (e>=p?['r','⭕']:e>0?['p','△']:['w','❌']) : (e>=p?['r','⭕']:['w','❌']);
    var my=S.ans[q.id];
    var myText = my==null||my===''||(Array.isArray(my)&&!my.length) ? '(답하지 않음)'
      : q.type==='mc' ? (Array.isArray(my)?my:[my]).map(function(n){return CIRCLED[n-1];}).join(', ')
      : q.type==='ox' ? (my?'O':'X') : String(my);
    var d=h('details',{},[
      h('summary',{},[h('span',{class:'mark '+mk[0],text:mk[1]}),(i+1)+'. '+q.question.split('\n')[0].slice(0,60)]),
      q.passage?h('div',{class:'passage',text:q.passage}):null,
      h('div',{class:'qtext',style:'margin-top:10px',text:q.question}),
      q.type==='mc'?h('div',{},q.choices.map(function(c,j){return h('div',{text:CIRCLED[j]+' '+c});})):null,
      h('div',{style:'margin-top:8px'},[h('b',{text:'내 답: '}),h('span',{text:myText})]),
      feedback(q,false)
    ]);
    if(mk[0]!=='r') d.open=true;
    rv.appendChild(d);
  });
  app.appendChild(rv);
  window.scrollTo(0,0);
}

/* ---------- 상세 오답풀이 ---------- */
function myAnswerText(q, my){
  if(my==null||my===''||(Array.isArray(my)&&!my.length)) return '(답하지 않음)';
  if(q.type==='mc') return (Array.isArray(my)?my:[my]).map(function(n){return CIRCLED[n-1]+' '+q.choices[n-1];}).join(', ');
  if(q.type==='ox') return my?'O':'X';
  return String(my);
}
function rightAnswerText(q){
  if(q.type==='mc') return (isMulti(q)?q.answer:[q.answer]).map(function(n){return CIRCLED[n-1]+' '+q.choices[n-1];}).join(', ');
  if(q.type==='ox') return q.answer?'O':'X';
  if(q.type==='short') return (Array.isArray(q.answer)?q.answer:[q.answer]).join(' / ');
  return q.modelAnswer||'';
}
function box(cls, title, kids){ return h('div',{class:'rv-box '+cls},[h('b',{class:'rv-t',text:title})].concat(kids)); }

/* 내 답이 왜 틀렸는지: 보기별 해설 / 자주 하는 오답 / 기본 문구 */
function whyWrong(q, my){
  var none = my==null||my===''||(Array.isArray(my)&&!my.length);
  if(none) return '답을 하지 않았어요. 아래 정답 풀이로 개념을 먼저 확인해 보세요.';
  if(q.type==='mc' && q.choiceExplanations){
    var picks=(Array.isArray(my)?my:[my]);
    var right=isMulti(q)?q.answer:[q.answer];
    var lines=picks.filter(function(n){return right.indexOf(n)<0;}).map(function(n){ return CIRCLED[n-1]+' '+(q.choiceExplanations[n-1]||''); });
    if(isMulti(q)){
      var missed=right.filter(function(n){return picks.indexOf(n)<0;});
      if(missed.length) lines.push('빠뜨린 정답: '+missed.map(function(n){return CIRCLED[n-1];}).join(', '));
    }
    if(lines.length) return lines.join('\n');
  }
  if(q.type==='short' && q.commonMistakes){
    var n=norm(my);
    for(var i=0;i<q.commonMistakes.length;i++){
      var m=q.commonMistakes[i], cands=Array.isArray(m.answer)?m.answer:[m.answer];
      if(cands.some(function(c){return norm(c)===n;})) return m.why;
    }
  }
  if(q.type==='ox' && q.wrongExplanation) return q.wrongExplanation;
  return '정답과 다른 답이에요. 아래 정답 풀이에서 어디가 달랐는지 비교해 보세요.';
}

function reviewCard(q, idx){
  var my=S.ans[q.id], kids=[];
  kids.push(h('div',{class:'qhead'},[
    h('span',{class:'qnum',text:(idx+1)+'.'}),
    h('span',{class:'chips',style:'margin:0'},[h('span',{class:'chip',text:q.concept||'기타'}),h('span',{class:'chip d-'+q.difficulty,text:'난이도 '+q.difficulty})]),
    h('span',{class:'pts',text:earned(q)+' / '+(q.points||0)+'점'})
  ]));
  if(q.passage) kids.push(h('div',{class:'passage',text:q.passage}));
  kids.push(h('div',{class:'qtext',text:q.question}));

  if(q.type==='essay'){
    kids.push(box('rv-my','✍️ 내 답안',[h('div',{class:'pre',text:my||'(작성하지 않음)'})]));
    if(q.rubric && q.rubric.length){
      var items=q.rubric.map(function(r,i){
        var ok=!!S.self[q.id+':'+i];
        return h('div',{class:'it '+(ok?'right':'wrong')},[
          h('div',{},[h('b',{text:(ok?'✓ ':'✗ ')}),r.criterion+' ('+(r.points||0)+'점)']),
          !ok&&r.tip?h('small',{text:'보완하려면: '+r.tip}):null
        ]);
      });
      kids.push(box('','📋 채점 기준별 점검',items));
    }
    kids.push(box('rv-ans','⭕ 모범 답안',[h('div',{class:'pre',text:q.modelAnswer||''})]));
  } else {
    kids.push(h('div',{class:'rv-pair'},[
      box('rv-my','❌ 내 답',[h('div',{text:myAnswerText(q,my)})]),
      box('rv-ans','⭕ 정답',[h('div',{text:rightAnswerText(q)})])
    ]));
    kids.push(box('rv-why','🤔 왜 틀렸을까?',[h('div',{class:'pre',text:whyWrong(q,my)})]));
  }

  kids.push(box('rv-detail','🔍 정답 풀이',[h('div',{class:'pre',text:q.detail||q.explanation||''})]));

  if(q.type==='mc' && q.choiceExplanations){
    var picks=Array.isArray(my)?my:[my], right=isMulti(q)?q.answer:[q.answer];
    var list=q.choices.map(function(c,i){
      var n=i+1, isR=right.indexOf(n)>=0, isMine=picks.indexOf(n)>=0;
      return h('div',{class:'it'+(isR?' right':isMine?' wrong':'')},[
        h('div',{},[h('b',{text:CIRCLED[i]+' '}),c,isMine?h('span',{class:'tag',text:'내 선택'}):null,isR?h('span',{class:'tag ok',text:'정답'}):null]),
        h('small',{text:q.choiceExplanations[i]||''})
      ]);
    });
    var det=h('details',{class:'rv-choices'},[h('summary',{text:'보기별 분석 펼치기'})].concat(list));
    kids.push(det);
  }
  if(q.tip) kids.push(box('rv-tip','💡 기억할 점',[h('div',{class:'pre',text:q.tip})]));
  if(q.source) kids.push(h('div',{class:'src',text:'📖 '+q.source}));
  return h('div',{class:'card',style:'margin-top:12px'},kids);
}

function renderReview(){
  S.view='review';
  stopTimer(); if(navEl){ navEl.remove(); navEl=null; }
  var app=document.getElementById('app'); app.innerHTML='';
  var R=summarize(), wrongQs=S.list.filter(function(q){return R.wrong.indexOf(q.id)>=0;});
  var concepts={}; wrongQs.forEach(function(q){ var c=q.concept||'기타'; concepts[c]=(concepts[c]||0)+1; });
  var ckeys=Object.keys(concepts).sort(function(a,b){return concepts[b]-concepts[a];});

  app.appendChild(h('div',{class:'card'},[
    h('div',{class:'muted',text:(S.mode==='exam'?'실전':'연습')+' · '+R.got+' / '+R.max+'점'}),
    h('h1',{text:'상세 오답풀이'}),
    h('p',{class:'muted',text:'틀린 문제 '+wrongQs.length+'개를 내가 고른 답 기준으로 풀이했어요.'}),
    ckeys.length?h('div',{},[h('b',{text:'다시 볼 개념'}),h('div',{class:'chips'},ckeys.map(function(c){return h('span',{class:'chip',text:c+' '+concepts[c]});}))]):null,
    h('div',{class:'row',style:'margin-top:14px'},[
      h('button',{onclick:function(){ if(location.hash==='#review') history.back(); else renderResult(); }},['← 결과로']),
      META.slidesHref?h('a',{class:'btnlink',href:META.slidesHref},['📘 요약 정리 다시 보기']):null,
      wrongQs.length?h('button',{class:'primary',onclick:function(){ start(wrongQs); }},['틀린 문제 다시 풀기']):null
    ])
  ]));
  wrongQs.forEach(function(q){ app.appendChild(reviewCard(q, S.list.indexOf(q))); });
  window.scrollTo(0,0);
}

/* 오답풀이는 주소에 #review를 붙여 '링크로 넘어가는' 화면으로 만든다 (뒤로가기 = 결과) */
function openReview(){
  try{ history.pushState({v:'review'},'',location.pathname+location.search+'#review'); }catch(e){}
  renderReview();
}
window.addEventListener('popstate',function(){
  if(location.hash==='#review'){ if(S.submitted || restoreLast()) renderReview(); }
  else if(S.view==='review'){ renderResult(); }
});
function clearHash(){ if(location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } }

/* ---------- 시작 ---------- */
document.title = (META.title||'사전 시험');
if(location.hash==='#review' && restoreLast()) renderReview(); else { clearHash(); renderStart(); }
})();
</script>
