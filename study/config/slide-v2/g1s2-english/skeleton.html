<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>

<!-- 한글 글꼴 CDN (유일한 외부 의존) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>{{CSS}}</style>
</head>
<body>
<div class="edit-hotzone"></div>
<button class="edit-toggle" id="editToggle" title="편집 모드 (E) / 저장 (Ctrl+S)">편집</button>

<div class="deck-viewport">
<main class="deck-stage" id="deckStage">

{{SLIDES}}

</main>
</div>

<div class="deck-controls" id="controls">
    <button id="prev" aria-label="이전">&#9664;</button>
    <svg id="orbit" viewBox="0 0 260 46" aria-hidden="true">
        <path id="orbitPath" d="M20 38 Q130 -22 240 38" fill="none" stroke="#8DB3E6" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
        <path id="orbitDone" d="M20 38 Q130 -22 240 38" fill="none" stroke="#FFC83D" stroke-width="4" stroke-linecap="round"/>
        <circle cx="16" cy="38" r="8" fill="#3B9AE8" stroke="#fff" stroke-width="2"/>
        <circle cx="244" cy="38" r="8" fill="#E4EEFB" stroke="#fff" stroke-width="2"/>
        <g id="rocketMark"><g transform="rotate(0)"><path d="M-14 -3 L14 0 L-14 5 L-9 0Z" fill="#fff" stroke="#14233F" stroke-width="1.5" stroke-linejoin="round"/><path d="M-9 0 L-14 -3 M-9 0 L-14 5" stroke="#14233F" stroke-width="1.2"/><path d="M-2 -1.5 L4 -8 L6 -7 L2 -1Z" fill="#FFC83D" stroke="#14233F" stroke-width="1"/></g></g>
    </svg>
    <span id="count">1 / {{N}}</span>
    <button id="next" aria-label="다음">&#9654;</button>
</div>

<script>
/* === 슬라이드 컨트롤러: 무대 크기 맞춤, 키보드/터치/휠, 편집 모드 === */
(function () {
    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var stage = document.getElementById('deckStage');
    var count = document.getElementById('count');
    var cur = 0;
    var mobile = window.matchMedia('(max-width: 1100px) and (orientation: portrait)');

    function scale() {
        if (mobile.matches) { stage.style.transform = ''; return; }
        var f = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * f) / 2;
        var y = (window.innerHeight - 1080 * f) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + f + ')';
    }
    function show(i) {
        cur = Math.max(0, Math.min(i, slides.length - 1));
        slides.forEach(function (s, k) {
            s.classList.toggle('active', k === cur);
            s.classList.toggle('visible', k === cur);
        });
        count.textContent = (cur + 1) + ' / ' + slides.length;
        var op = document.getElementById('orbitPath');
        if (op && op.getTotalLength) {
            var L = op.getTotalLength(), p = slides.length > 1 ? cur / (slides.length - 1) : 0;
            var a = op.getPointAtLength(p * L), b = op.getPointAtLength(Math.min(L, p * L + 1)), c = op.getPointAtLength(Math.max(0, p * L - 1));
            var ang = Math.atan2(b.y - c.y, b.x - c.x) * 180 / Math.PI;
            document.getElementById('rocketMark').setAttribute('transform', 'translate(' + a.x + ' ' + a.y + ') rotate(' + ang + ')');
            var od = document.getElementById('orbitDone');
            od.style.strokeDasharray = L; od.style.strokeDashoffset = L * (1 - p);
        }
    }
    window.addEventListener('resize', scale);
    scale(); show(0);

    document.getElementById('prev').onclick = function () { show(cur - 1); };
    document.getElementById('next').onclick = function () { show(cur + 1); };

    var editing = false;
    document.addEventListener('keydown', function (e) {
        if (e.target.isContentEditable) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(); }
            return;
        }
        if (mobile.matches) return;
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) > -1) { e.preventDefault(); show(cur + 1); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) > -1) { e.preventDefault(); show(cur - 1); }
        else if (e.key === 'Home') show(0);
        else if (e.key === 'End') show(slides.length - 1);
        else if (e.key === 'e' || e.key === 'E') toggleEdit();
    });
    var tx = null;
    document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
        if (tx === null || mobile.matches || editing) return;
        var dx = e.changedTouches[0].clientX - tx; tx = null;
        if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    });
    var wheelLock = false;
    document.addEventListener('wheel', function (e) {
        if (mobile.matches || wheelLock || editing) return;
        wheelLock = true; setTimeout(function () { wheelLock = false; }, 500);
        show(cur + (e.deltaY > 0 ? 1 : -1));
    }, { passive: true });

    /* 편집 모드: 왼쪽 위 모서리 hover 또는 E 키, Ctrl+S로 저장(내려받기) */
    var tgl = document.getElementById('editToggle');
    var hz = document.querySelector('.edit-hotzone');
    var t = null;
    function toggleEdit() {
        editing = !editing;
        document.body.classList.toggle('editing', editing);
        tgl.classList.toggle('active', editing);
        tgl.textContent = editing ? '편집 중 (Ctrl+S 저장)' : '편집';
        document.querySelectorAll('.slide h2, .slide p, .slide li, .slide td, .slide th, .slide h3')
            .forEach(function (n) { n.contentEditable = editing ? 'true' : 'false'; });
    }
    function save() {
        var was = editing; if (was) toggleEdit();
        var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
        a.download = 'slides.html'; a.click();
        if (was) toggleEdit();
    }
    hz.addEventListener('mouseenter', function () { clearTimeout(t); tgl.classList.add('show'); });
    hz.addEventListener('mouseleave', function () { t = setTimeout(function () { if (!editing) tgl.classList.remove('show'); }, 400); });
    tgl.addEventListener('mouseenter', function () { clearTimeout(t); });
    tgl.addEventListener('mouseleave', function () { t = setTimeout(function () { if (!editing) tgl.classList.remove('show'); }, 400); });
    tgl.addEventListener('click', toggleEdit);
})();
</script>
<script>
/* 폰 화면용: 표 머리 글을 각 칸에 붙여 두면(data-label) CSS가 행 단위 카드로 쌓아 보여 준다 */
(function(){
  document.querySelectorAll('.slide table').forEach(function(t){
    var rows=[].slice.call(t.rows); if(rows.length<2) return;
    var hr=rows[0]; if(![].every.call(hr.cells,function(c){return c.tagName==='TH';})) return;
    var labels=[], col=0;
    [].forEach.call(hr.cells,function(c){ var n=c.colSpan||1; for(var k=0;k<n;k++) labels[col++]=c.textContent.replace(/\s+/g,' ').trim(); });
    hr.classList.add('hrow');
    var busy=[];
    rows.slice(1).forEach(function(r){
      var c=0;
      [].forEach.call(r.cells,function(cell){
        while(busy[c]>0){ c++; }
        if(c>0 && labels[c]) cell.setAttribute('data-label',labels[c]);
        var rs=cell.rowSpan||1, cs=cell.colSpan||1;
        for(var k=0;k<cs;k++){ if(rs>1) busy[c+k]=rs; }
        c+=cs;
      });
      for(var i=0;i<busy.length;i++){ if(busy[i]>0 && !(busy[i]===undefined)) { /* 아래에서 감소 */ } }
      busy=busy.map(function(v){ return v>0 ? v-1 : 0; });
    });
    t.classList.add('stack');
  });
})();
</script>
</body>
</html>
